<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; script-src-elem 'self' https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://www.google-analytics.com; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-src https://www.openstreetmap.org">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Saugiai atkurkite arba pakeiskite Atminimas paskyros slaptažodį.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/atminimas-candle.jpg" type="image/jpeg">
<title>Atkurti slaptažodį - Atminimas</title>
<link rel="stylesheet" href="css/styles.css?v=20260811-2">
</head>
<body data-loading>
<div class="site-shell">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html"><span class="brand__mark"><img src="assets/atminimas-candle.jpg" alt=""></span><span class="brand__name">Atminimas</span></a>
      <nav class="site-nav" aria-label="Pagrindinė navigacija"><a href="prisijungti.html">Prisijungti</a></nav>
    </div>
  </header>
  <main class="site-main">
    <section class="client-access auth-page" aria-labelledby="password-title">
      <div class="client-access__intro">
        <p class="eyebrow">Paskyros saugumas</p>
        <h1 id="password-title">Atkurti slaptažodį</h1>
        <p id="password-intro">Įrašykite paskyros el. paštą ir atsiųsime saugią slaptažodžio atkūrimo nuorodą.</p>
      </div>

      <form class="auth-form" id="password-request-form" data-friendly-validation>
        <div class="form-field">
          <label for="recovery-email">El. paštas</label>
          <input id="recovery-email" type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
        </div>
        <button class="button" type="submit">Siųsti atkūrimo nuorodą</button>
      </form>

      <form class="auth-form" id="password-update-form" data-friendly-validation hidden>
        <div class="form-field">
          <label for="new-password">Naujas slaptažodis</label>
          <input id="new-password" type="password" name="password" autocomplete="new-password" minlength="12" required aria-describedby="password-update-help">
        </div>
        <p id="password-update-help" class="editor-note">Bent 12 simbolių. Naudokite unikalų slaptažodį, kurio nenaudojate kitur.</p>
        <div class="form-field">
          <label for="confirm-password">Pakartokite slaptažodį</label>
          <input id="confirm-password" type="password" name="password_confirm" autocomplete="new-password" minlength="12" required>
        </div>
        <button class="button" type="submit">Išsaugoti naują slaptažodį</button>
      </form>

      <p class="form-status" id="password-status" role="status" aria-live="polite"></p>
      <p class="auth-switch"><a href="prisijungti.html">Grįžti į prisijungimą</a></p>
    </section>
  </main>
</div>
<script src="assets/supabase-config.js?v=20260618"></script>
<script src="assets/form-validation.js?v=20260724-4"></script>
<script src="assets/password-reset.js?v=20260724-2"></script>
<script src="assets/loading.js?v=20260811-2"></script>
<script src="assets/site-ui.js?v=20260811-2"></script>
</body>
</html>
