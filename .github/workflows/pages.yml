name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_ready:
        description: Supabase Edge Functions, frontend config and database migration are ready
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.backend_ready }}
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check JavaScript syntax
        shell: bash
        run: find assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Prepare public website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -- *.html favicon.ico robots.txt sitemap.xml _site/
          cp -R assets css _site/
          rm -f _site/assets/supabase-config.example.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
