name: Verify website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check JavaScript syntax
        shell: bash
        run: find assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
