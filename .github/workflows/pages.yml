name: Verify website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check JavaScript syntax
        shell: bash
        run: find assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
